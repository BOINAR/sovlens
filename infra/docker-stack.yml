# Rotation des logs des conteneurs : sans limite, ils grossissent indéfiniment sur le disque du VPS
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/boinar/sovlens/backend:${IMAGE_TAG:-latest}
    environment:
      PORT: "4000"
      FRONTEND_URL: https://sovlens.stellodev.com
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # Clé AES-256 (base64, 32 octets) du chiffrement au repos des identifiants S3 souverains
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: 7d
      S3_CLOUD_ENDPOINT: http://garage:3900
      S3_CLOUD_PUBLIC_ENDPOINT: https://sovlens-garage.stellodev.com
      S3_CLOUD_ACCESS_KEY: ${S3_CLOUD_ACCESS_KEY}
      S3_CLOUD_SECRET_KEY: ${S3_CLOUD_SECRET_KEY}
      S3_CLOUD_BUCKET: ${S3_CLOUD_BUCKET}
      # Hôtes privés autorisés comme endpoint souverain (Garage du homelab via Tailscale)
      SOVEREIGN_ENDPOINT_ALLOWED_HOSTS: "192.168.1.20"
      NODE_ENV: production
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/boinar/sovlens/frontend:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: https://sovlens-api.stellodev.com
      NODE_ENV: production
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    secrets:
      - source: garage_rpc_secret
        target: garage_rpc_secret
        mode: 0400
      - source: garage_admin_token
        target: garage_admin_token
        mode: 0400
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  backup:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: sovlens-backups
      BACKUP_HOUR_UTC: "1"
    configs:
      - source: backup_script
        target: /usr/local/bin/backup.sh
        mode: 0555
    secrets:
      - source: backup_s3_access_key
        target: backup_s3_access_key
        mode: 0400
      - source: backup_s3_secret_key
        target: backup_s3_secret_key
        mode: 0400
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /etc/caddy/certs:/etc/caddy/certs
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sovlens-net
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  sovlens-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:

# Secrets créés par le pipeline depuis les GitHub Secrets, versionnés par commit
# (un secret Swarm est immuable). Aucun secret n'est écrit sur le disque du VPS.
secrets:
  garage_rpc_secret:
    external: true
    name: garage_rpc_secret_${SECRET_VERSION}
  garage_admin_token:
    external: true
    name: garage_admin_token_${SECRET_VERSION}
  backup_s3_access_key:
    external: true
    name: backup_s3_access_key_${SECRET_VERSION}
  backup_s3_secret_key:
    external: true
    name: backup_s3_secret_key_${SECRET_VERSION}

configs:
  backup_script:
    file: ./scripts/backup.sh
    name: backup_script_${SECRET_VERSION}
