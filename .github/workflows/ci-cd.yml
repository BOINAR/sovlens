name: CI/CD SovLens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: boinar/sovlens/backend
  IMAGE_FRONTEND: boinar/sovlens/frontend

jobs:
  backend-test:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Tests unitaires + couverture
        run: pnpm run test:cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  frontend-lint:
    name: Frontend - Lint & Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build (vérification que ça compile)
        run: pnpm run build

  build-and-push:
    name: Build & Push images Docker
    needs: [backend-test, frontend-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_BACKEND }}:latest
            ghcr.io/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://sovlens-api.stellodev.com
          tags: |
            ghcr.io/${{ env.IMAGE_FRONTEND }}:latest
            ghcr.io/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy en production (Swarm)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copie des fichiers de déploiement sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "infra/docker-stack.yml,infra/Caddyfile,infra/garage.toml.template,infra/scripts/backup.sh"
          target: "~/sovlens-deploy"

      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/sovlens-deploy/infra
            export IMAGE_TAG=${{ github.sha }}
            export SECRET_VERSION=$(echo "${{ github.sha }}" | cut -c1-12)
            export POSTGRES_USER=${{ secrets.STAGING_POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            export POSTGRES_DB=${{ secrets.STAGING_POSTGRES_DB }}
            export JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            export STORAGE_ENCRYPTION_KEY='${{ secrets.STAGING_STORAGE_ENCRYPTION_KEY }}'
            export S3_CLOUD_ACCESS_KEY=${{ secrets.STAGING_S3_ACCESS_KEY }}
            export S3_CLOUD_SECRET_KEY=${{ secrets.STAGING_S3_SECRET_KEY }}
            export S3_CLOUD_BUCKET=${{ secrets.STAGING_S3_BUCKET }}

            # Docker secrets Swarm créés depuis les GitHub Secrets (chiffrés dans le Raft,
            # montés en mémoire dans /run/secrets, jamais écrits sur le disque du VPS)
            create_secret() {
              docker secret inspect "$1_${SECRET_VERSION}" >/dev/null 2>&1 \
                || printf '%s' "$2" | docker secret create "$1_${SECRET_VERSION}" - >/dev/null
            }
            create_secret garage_rpc_secret '${{ secrets.GARAGE_RPC_SECRET }}'
            create_secret garage_admin_token '${{ secrets.GARAGE_ADMIN_TOKEN }}'
            create_secret backup_s3_access_key '${{ secrets.BACKUP_S3_ACCESS_KEY }}'
            create_secret backup_s3_secret_key '${{ secrets.BACKUP_S3_SECRET_KEY }}'

            # garage.toml ne contient plus aucun secret : simple copie du template
            cp garage.toml.template garage.toml
            envsubst '${IMAGE_TAG} ${SECRET_VERSION} ${POSTGRES_USER} ${POSTGRES_PASSWORD} ${POSTGRES_DB} ${JWT_SECRET} ${STORAGE_ENCRYPTION_KEY} ${S3_CLOUD_ACCESS_KEY} ${S3_CLOUD_SECRET_KEY} ${S3_CLOUD_BUCKET}' < docker-stack.yml > docker-stack-resolved.yml
            docker stack deploy -c docker-stack-resolved.yml sovlens --with-registry-auth
            rm docker-stack-resolved.yml
            docker service update --force sovlens_caddy

            # Nettoyage des anciennes versions de secrets (celles encore utilisées sont ignorées)
            docker secret ls --format '{{.Name}}' \
              | grep -E '^(garage_rpc_secret|garage_admin_token|backup_s3_access_key|backup_s3_secret_key)_' \
              | grep -v "_${SECRET_VERSION}$" \
              | xargs -r docker secret rm >/dev/null 2>&1 || true
            docker config ls --format '{{.Name}}' \
              | grep -E '^backup_script_' \
              | grep -v "_${SECRET_VERSION}$" \
              | xargs -r docker config rm >/dev/null 2>&1 || true

            # Nettoyage disque, limité à SovLens : anciennes images backend/frontend
            # (toutes restent disponibles dans GHCR pour un retour arrière).
            # Une image encore utilisée par un conteneur est refusée par docker et ignorée.
            docker image ls --filter "reference=ghcr.io/boinar/sovlens/*" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ":${IMAGE_TAG}$" \
              | xargs -r docker image rm >/dev/null 2>&1 || true
            # Swarm garde par défaut 5 conteneurs arrêtés par service : 2 suffisent pour diagnostiquer
            docker swarm update --task-history-limit 2 >/dev/null

  deploy-monitoring:
    name: Deploy monitoring (Swarm)
    needs: deploy-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copie des fichiers de monitoring sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "monitoring/docker-stack.monitoring.yml,monitoring/prometheus/prometheus.yml,monitoring/grafana"
          target: "~/sovlens-deploy"
      - name: Deploy monitoring stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/sovlens-deploy/monitoring
            export SECRET_VERSION=$(echo "${{ github.sha }}" | cut -c1-12)

            create_secret() {
              docker secret inspect "$1_${SECRET_VERSION}" >/dev/null 2>&1 \
                || printf '%s' "$2" | docker secret create "$1_${SECRET_VERSION}" - >/dev/null
            }
            create_secret grafana_admin_password '${{ secrets.GRAFANA_ADMIN_PASSWORD }}'
            create_secret garage_homelab_metrics_token '${{ secrets.GARAGE_HOMELAB_METRICS_TOKEN }}'

            envsubst '${SECRET_VERSION}' < docker-stack.monitoring.yml > docker-stack-monitoring-resolved.yml
            docker stack deploy -c docker-stack-monitoring-resolved.yml monitoring
            rm docker-stack-monitoring-resolved.yml

            docker secret ls --format '{{.Name}}' \
              | grep -E '^(grafana_admin_password|garage_homelab_metrics_token)_' \
              | grep -v "_${SECRET_VERSION}$" \
              | xargs -r docker secret rm >/dev/null 2>&1 || true

            # Les images :latest remplacées deviennent orphelines (<none>) : suppression des seules
            # images sans tag et inutilisées, ce qui ne touche à aucun autre projet
            docker image prune -f >/dev/null 2>&1 || true
